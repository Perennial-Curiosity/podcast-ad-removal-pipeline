# Podcast ad-removal pipeline configuration.
# Each podcast gets an id; the pipeline runs with --podcast <id>.
# Add new podcasts here — no code changes needed.
#
# Optional per-podcast key (dynamic slots, 2026-11-11):
#   dynamic_ads: true|false
# When set, it overrides the probe: true runs the second-download slot
# flow on every episode, false skips it. When absent (the default), the
# pipeline probes once per podcast (a second download, byte-compared)
# and remembers the result for 30 days.

github_owner: Perennial-Curiosity
github_repo: Clean-Podcasts

podcasts:
  security-now:
    name: "Security Now"
    feed_url: "https://feeds.twit.tv/sn.xml"
    github_feed_path: "feeds/Security-Now"
    # house plugs marked like sponsor ads (2026-10-07)
    house_plugs:
      - label: "Club TWiT"
        variants: ["club twit", "clubtwit"]
      - label: "Patreon"
        variants: ["patreon", "patreon.com"]
  unsubscribe:
    name: "Unsubscribe Podcast"
    feed_url: "https://feeds.megaphone.fm/UG3792007027"
    github_feed_path: "feeds/Unsubscribe-Podcast"
    house_plugs:
      - label: "Pepperbox"
        variants: ["pepperbox", "pepperbox.tv"]
      - label: "Patreon"
        variants: ["patreon", "patreon.com"]
